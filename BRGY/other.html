<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* This lines the officials up in a row */
        .team-container {
            display: flex;
            gap: 20px;
            font-family: Arial, sans-serif;
        }

        /* This styles each official's box */
        .official-card {
            border: 1px solid #ccc;
            padding: 15px;
            width: 250px;
            text-align: center;
            border-radius: 8px;
        }

        /* This resizes the official's photo */
        .official-photo {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="team-container">
        <!-- Official 1 -->
        <div class="official-card">
            <img src="https://placeholder.com" alt="Official Photo" class="official-photo">
            <h3>Juan Dela Cruz</h3>
            <p><strong>Barangay Captain</strong></p>
            <p>Email: captain@indahag.com</p>
        </div>

        <!-- Official 2 -->
        <div class="official-card">
            <img src="https://placeholder.com" alt="Official Photo" class="official-photo">
            <h3>Maria Santos</h3>
            <p><strong>Barangay Kagawad</strong></p>
            <p>Email: maria@indahag.com</p>
        </div>
    </div>

</body>
</html>
